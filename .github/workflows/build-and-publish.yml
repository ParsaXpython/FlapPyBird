name: Build & Publish

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # required for creating releases on tag push

jobs:
  build:
    name: Build desktop package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: make init

      - name: Package desktop build
        run: |
          mkdir -p dist
          zip -r dist/FlapPyBird-desktop.zip \
            main.py src assets pyproject.toml Makefile README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flappybird-desktop
          path: dist/FlapPyBird-desktop.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flappybird-desktop
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/FlapPyBird-desktop.zip
          generate_release_notes: true